spring.application.name=eco-air-backend
server.port=8080

# Base de datos embebida (H2) gestionada por Hibernate/JPA
spring.datasource.url=jdbc:h2:mem:ecoair;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
